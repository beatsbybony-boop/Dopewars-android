name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Apply icon, bar colors and portrait lock
        run: bash scripts/brand-android.sh

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DopeWars.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DopeWars-apk
          path: DopeWars.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DopeWars.apk \
            --title "Dope Wars (latest build)" \
            --notes "Download DopeWars.apk below, open it on your Android phone and install. Built from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
